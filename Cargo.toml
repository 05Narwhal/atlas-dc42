[package]
name = "atlas-dc42"
version = "26.0.1-a"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Read DiskCopy 4.2 floppy disk images."
repository = "https://github.com/05Narwhal/atlas-dc42"
homepage = "https://julianloy.com"
readme = "README.md"
keywords = ["diskcopy", "dc42", "floppy", "macos", "parser"]
categories = ["filesystem", "parser-implementations"]
authors = ["Julian A. Loy"]

[features]
# Image builder, for crates that test against this one.
test-util = []

[dependencies]
atlas-fs-core = { version = "26.0.1-a", path = "../atlas-fs-core" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
